name: Frontend Authentication Build
on:
  push:
    branches: [feature/authentication-foundation]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Tee/package-lock.json
      - name: Install dependencies
        working-directory: Tee
        run: npm ci
      - name: Build
        working-directory: Tee
        run: npm run build
